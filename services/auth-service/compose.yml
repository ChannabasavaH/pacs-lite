services:

  backend:
    build: .
    container_name: pacs-auth
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: pacs-auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cha010@#3
      POSTGRES_DB: pacs_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pacs_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: pacs_auth_postgres_data


