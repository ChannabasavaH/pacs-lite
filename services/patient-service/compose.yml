services:

  backend:
    build: .
    container_name: pacs-patient
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: pacs-patient-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cha010@#3
      POSTGRES_DB: pacs_patient
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pacs_patient"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: pacs_patient_postgres_data


